name: Test no linters enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload
        run: bash tests/fixtures/setup-fake-flake8.sh none
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action succeeded with no linters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when no linters are enabled"
            exit 1
          fi
          echo "PASS"
