name: Test linter that cannot be verified fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake linters (clean)
        run: bash tests/fixtures/setup-fake-linters.sh clean
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-lint/event.json
        with:
          flake8: "true"
          # "false flake8 --version" always fails, simulating a missing linter
          flake8_command_prefix: "false"
      - name: Assert action failed during setup verification
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when linter is not installed"
            exit 1
          fi
          if grep -q -- '--filename' /tmp/fake-lint/flake8.log; then
            echo "FAIL: lint should not have run"
            exit 1
          fi
          echo "PASS"
