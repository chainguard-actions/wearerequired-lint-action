name: Test custom args, extensions, dir and command prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload and fake flake8
        run: bash tests/fixtures/setup-fake-flake8.sh clean
      - id: action
        uses: .
        continue-on-error: true
        with:
          flake8: "true"
          flake8_dir: tests/fixtures
          flake8_extensions: "py,pyi"
          flake8_args: "--max-line-length 120"
          flake8_command_prefix: "env FAKE_PREFIX_VAR=prefixed"
          continue_on_error: "false"
      - name: Assert options were passed to flake8
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/flake8-calls.log
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! grep -q -- '--filename \*\*/\*\.py,\*\*/\*\.pyi --max-line-length 120' /tmp/flake8-calls.log; then
            echo "FAIL: extensions/args not passed as expected"
            exit 1
          fi
          if ! grep -q 'FAKE_PREFIX_VAR: prefixed' /tmp/flake8-calls.log; then
            echo "FAIL: command prefix was not applied"
            exit 1
          fi
          if ! grep -q 'PWD: .*/tests/fixtures$' /tmp/flake8-calls.log; then
            echo "FAIL: flake8 was not run in flake8_dir"
            exit 1
          fi
          echo "PASS"
