name: Test lint failures fail the step when continue_on_error is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake linters (errors)
        run: bash tests/fixtures/setup-fake-linters.sh errors
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-lint/event.json
        with:
          continue_on_error: "false"
          flake8: "true"
      - name: Assert flake8 lint ran
        run: |
          cat /tmp/fake-lint/flake8.log
          if ! grep -q -- '--filename' /tmp/fake-lint/flake8.log; then
            echo "FAIL: flake8 lint command was not executed"
            exit 1
          fi
          echo "PASS"
      - name: Assert action failed due to lint failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when linting errors are found and continue_on_error=false"
            exit 1
          fi
          echo "PASS"
