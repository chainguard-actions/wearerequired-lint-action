name: Test flake8 errors fail the step when continue_on_error is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload and fake flake8 reporting errors
        run: bash tests/fixtures/setup-fake-flake8.sh errors
      - id: action
        uses: .
        continue-on-error: true
        with:
          flake8: "true"
          continue_on_error: "false"
      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/flake8-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when lint errors exist and continue_on_error=false"
            exit 1
          fi
          if ! grep -q -- '--filename' /tmp/flake8-calls.log; then
            echo "FAIL: flake8 lint command was not run (failure came from elsewhere)"
            exit 1
          fi
          echo "PASS"
