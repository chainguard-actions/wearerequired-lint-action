name: Test nonexistent lint directory fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake linters (clean)
        run: bash tests/fixtures/setup-fake-linters.sh clean
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-lint/event.json
        with:
          flake8: "true"
          flake8_dir: this-directory-does-not-exist
      - name: Assert action failed and linter never ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-lint/flake8.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing directory"
            exit 1
          fi
          if [ -s /tmp/fake-lint/flake8.log ]; then
            echo "FAIL: flake8 should not have been invoked"
            exit 1
          fi
          echo "PASS"
