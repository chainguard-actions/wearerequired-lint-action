name: Test flake8 clean run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload and fake flake8
        run: bash tests/fixtures/setup-fake-flake8.sh clean
      - id: action
        uses: .
        continue-on-error: true
        with:
          flake8: "true"
          continue_on_error: "false"
      - name: Assert action succeeded and invoked flake8
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- flake8 calls ---"
          cat /tmp/flake8-calls.log
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for a clean lint run"
            exit 1
          fi
          if ! grep -q -- '--version' /tmp/flake8-calls.log; then
            echo "FAIL: flake8 setup was not verified (--version)"
            exit 1
          fi
          if ! grep -q -- '--filename \*\*/\*\.py' /tmp/flake8-calls.log; then
            echo "FAIL: flake8 was not run with --filename **/*.py"
            exit 1
          fi
          echo "PASS"
