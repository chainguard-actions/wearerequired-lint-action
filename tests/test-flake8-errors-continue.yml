name: Test flake8 errors with continue_on_error (default true)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload and fake flake8 reporting errors
        run: bash tests/fixtures/setup-fake-flake8.sh errors
      - id: action
        uses: .
        continue-on-error: true
        with:
          flake8: "true"
      - name: Assert action did not fail the workflow
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/flake8-calls.log
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success because continue_on_error defaults to true"
            exit 1
          fi
          if ! grep -q -- '--filename' /tmp/flake8-calls.log; then
            echo "FAIL: flake8 lint command was not run"
            exit 1
          fi
          echo "PASS"
