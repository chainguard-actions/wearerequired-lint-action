name: Test nonexistent linter directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare event payload and fake flake8
        run: bash tests/fixtures/setup-fake-flake8.sh clean
      - id: action
        uses: .
        continue-on-error: true
        with:
          flake8: "true"
          flake8_dir: this-directory-does-not-exist
      - name: Assert action failed before running flake8
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/flake8-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent flake8_dir"
            exit 1
          fi
          if [ -s /tmp/flake8-calls.log ]; then
            echo "FAIL: flake8 should not have been invoked"
            exit 1
          fi
          echo "PASS"
